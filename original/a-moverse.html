<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}</style>
<title>¡A Moverse!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: escenario a la izquierda; bloques y programa a la derecha. En celular: todo apilado, sin scroll de página. Estética única clara, alto contraste (pensada para proyector y netbook). */
:root{
  --bg:#E6EEF3; --surface:#FFFFFF; --ink:#13202B; --muted:#43535F; --line:#C3D2DC;
  --stage:#F8FCF9; --grid:#E3EEE7; --axis:#2C3E4C;
  --accent:#E8553F; --accent-ink:#FFFFFF; --go:#178A4B; --stop:#C8332F; --ok:#178A4B; --soft:#FFF4D6;
  --ev:#FFBF00; --ev-d:#B88A00; --mo:#4C97FF; --mo-d:#2B66BF; --co:#FFAB19; --co-d:#B97808; --se:#5CB1D6; --se-d:#2B7FA6;
  --blk-ink:#111B24; --slot:#EEF3F6;
  --f-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',Verdana,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* encabezado */
.top{display:flex;align-items:center;gap:10px;flex:none;min-height:48px}
.brand{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.2px;white-space:nowrap}
.brand b{color:var(--accent)}
.lvl{flex:1;min-width:0;display:flex;align-items:center;gap:8px;justify-content:center}
.lvl-name{font-family:var(--f-display);font-weight:600;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lvl-num{background:var(--ink);color:#fff;border-radius:999px;padding:3px 12px;font-weight:700;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ibtn{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.ibtn:hover{border-color:var(--ink)}
.ibtn svg{width:22px;height:22px}
.ibtn[disabled]{opacity:.35;cursor:default}

.goal{flex:none;background:var(--surface);border-radius:14px;padding:9px 16px;font-weight:700;font-size:18px;line-height:1.3;display:flex;gap:10px;align-items:center;border:2px solid var(--ink)}
.goal .tag{flex:none;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:600;border-radius:8px;padding:2px 10px;font-size:15px}

.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.18fr);gap:12px}
.left{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.stage-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage-box{position:relative;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--stage);touch-action:none}
.stage-box canvas{display:block;width:100%;height:100%}
.xy{position:absolute;left:8px;top:8px;background:var(--surface);border:2px solid var(--ink);border-radius:10px;padding:3px 10px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;display:flex;gap:12px;pointer-events:none}
.xy .ax{color:var(--mo-d)} .xy .ay{color:#B2341F}
.fb{position:absolute;left:10px;right:10px;bottom:10px;background:var(--ink);color:#fff;border-radius:12px;padding:9px 14px;font-weight:700;font-size:16px;line-height:1.3;box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer}
.fb.good{background:var(--ok)}

.controls{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
.run{display:flex;gap:8px;align-items:center}
.bigbtn{height:56px;min-width:56px;border-radius:14px;border:3px solid var(--ink);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;font-weight:700;font-size:17px;box-shadow:0 3px 0 var(--ink)}
.bigbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.bigbtn svg{width:28px;height:28px}
.bigbtn.flag{background:#E3F6EA}
.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,46px);gap:5px;touch-action:none}
.pad button{border-radius:12px;border:3px solid var(--ink);background:var(--surface);display:grid;place-items:center;box-shadow:0 3px 0 var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
.pad button svg{width:24px;height:24px}
.pad button.on{background:var(--soft);transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.pad.off{opacity:.3;pointer-events:none}

.right{display:grid;grid-template-columns:232px minmax(0,1fr);gap:10px;min-height:0;min-width:0}
.palette{background:var(--surface);border-radius:14px;border:2px solid var(--line);padding:10px;overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
.pal-title,.prog-title{font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--muted);margin:0}
.pal-group{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pal-cat{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px}
.pal-cat i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.pal-items{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.palette .blk{box-shadow:0 2px 0 rgba(0,0,0,.25);font-size:14px;gap:5px;padding:5px 9px}
.palette .condslot{width:44px}
.palette .blk:hover{filter:brightness(1.05);transform:translateX(2px)}

.program{position:relative;background-color:var(--surface);background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:18px 18px;border-radius:14px;border:2px solid var(--line);overflow:auto;padding:12px;min-height:0;min-width:0}
.prog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.ghost{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;font-weight:700;font-size:14px}
.empty{color:var(--muted);font-weight:700;max-width:30ch;line-height:1.4;background:var(--surface);padding:8px}
.stack{display:flex;flex-direction:column;align-items:flex-start;margin-bottom:18px}
.list{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding-top:3px}

/* bloques */
.blk{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:7px;font-weight:700;font-size:15px;color:var(--blk-ink);border:2px solid;min-height:40px;box-sizing:border-box;cursor:pointer;user-select:none;-webkit-user-select:none;white-space:nowrap}
.blk.ev{background:var(--ev);border-color:var(--ev-d)}
.blk.mo{background:var(--mo);border-color:var(--mo-d)}
.blk.co{background:var(--co);border-color:var(--co-d)}
.blk.se{background:var(--se);border-color:var(--se-d);border-radius:20px}
.blk.hat{border-radius:22px 22px 7px 7px;padding-top:11px;min-height:46px}
.blk svg.fl{width:22px;height:22px}
.num,.val{width:54px;border:2px solid rgba(0,0,0,.25);border-radius:999px;background:#fff;text-align:center;padding:3px 4px;font-weight:700;color:var(--ink);box-sizing:border-box}
.val{display:inline-block;width:auto;min-width:36px;padding:2px 10px}
.key{border:2px solid rgba(0,0,0,.25);border-radius:8px;background:#fff;padding:3px 2px;font-weight:700;color:var(--ink);max-width:132px;font-size:14px}
.del{width:26px;height:26px;border-radius:50%;border:none;background:rgba(0,0,0,.18);display:grid;place-items:center;flex:none;margin-left:2px}
.del svg{width:12px;height:12px}
.del:hover{background:rgba(0,0,0,.32)}
.cblk{display:flex;flex-direction:column;border:2px solid var(--co-d);background:var(--co);border-radius:7px;min-width:190px;box-sizing:border-box}
.cblk>.blk{border:none;background:transparent;border-radius:7px 7px 0 0}
.mouth{margin-left:18px;background:var(--surface);border-radius:6px 0 0 6px;min-height:34px;padding:2px 4px 4px;border-left:2px solid var(--co-d);border-top:2px solid var(--co-d);border-bottom:2px solid var(--co-d);cursor:pointer}
.cfoot{height:18px;cursor:pointer}
.condslot{display:inline-block;width:70px;height:28px;border-radius:14px;background:var(--slot);border:2px dashed var(--se-d)}
.condslot.sel{background:var(--soft);border:3px solid var(--accent)}
.cursor{display:flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:7px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;white-space:nowrap;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.65}}
.ro .blk{cursor:default}

/* paneles especiales */
.explore{display:flex;flex-direction:column;gap:12px}
.explore p{margin:0;font-weight:700;font-size:17px;line-height:1.35}
.ex-row{display:flex;align-items:center;gap:8px}
.ex-row label{width:22px;font-weight:700;font-size:20px}
.ex-row .step{width:48px;height:44px;border-radius:10px;border:2px solid var(--ink);background:var(--surface);font-weight:700}
.ex-row input{width:80px;height:44px;border-radius:10px;border:2px solid var(--ink);text-align:center;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.primary{border:3px solid var(--ink);background:var(--accent);color:#fff;border-radius:12px;padding:10px 18px;font-weight:700;font-size:17px;box-shadow:0 3px 0 var(--ink);align-self:flex-start}
.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.hintline{color:var(--muted);font-size:15px;line-height:1.4}
.cierre{display:flex;flex-direction:column;gap:12px}
.twoprog{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.twoprog h4{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:6px}
.twoprog h4 i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.twoprog .blk{font-size:12px;min-height:30px;padding:3px 7px}
.twoprog .blk.hat{min-height:34px;padding-top:7px}
.twoprog .cblk{min-width:0}
.twoprog .mouth{min-height:20px;margin-left:12px}
.twoprog .cfoot{height:10px}
.twoprog .stack{margin-bottom:6px}
.q{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:7px}
.q p{margin:0;font-weight:700;font-size:16px}
.q button{text-align:left;border:2px solid var(--ink);border-radius:10px;background:var(--surface);padding:8px 10px;font-weight:700;font-size:15px;line-height:1.3}
.q button.yes{background:#DDF3E5;border-color:var(--ok)}
.q button.no{background:#FBE3DF}
.q .why{font-size:15px;line-height:1.4;color:var(--ink)}

/* pantallas */
.screen{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.start{max-width:980px;margin:0 auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:center}
.start h1{font-family:var(--f-display);font-weight:700;font-size:clamp(44px,8vw,84px);line-height:.95;margin:0;letter-spacing:-.5px}
.start h1 span{color:var(--accent)}
.tagline{font-size:20px;font-weight:700;margin:12px 0 18px;line-height:1.35;max-width:30ch}
.modes{display:flex;gap:12px;flex-wrap:wrap}
.mode{border:3px solid var(--ink);border-radius:16px;background:var(--surface);padding:12px 20px;text-align:left;box-shadow:0 4px 0 var(--ink);min-width:170px}
.mode strong{display:block;font-family:var(--f-display);font-size:24px;font-weight:600}
.mode small{font-size:14px;color:var(--muted);font-weight:700}
.mode.main-mode{background:var(--accent);color:#fff}
.mode.main-mode small{color:#FFE6E1}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.hero-cv{width:100%;max-width:440px;aspect-ratio:4/3;justify-self:center;border:3px solid var(--ink);border-radius:18px;background:var(--stage)}
.levels{grid-column:1/-1}
.levels h2,.teach h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0 0 10px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.lbtn{border:2px solid var(--ink);border-radius:12px;background:var(--surface);padding:8px 10px;text-align:left;display:flex;gap:10px;align-items:center;min-height:52px}
.lbtn b{font-family:var(--f-display);font-size:22px;width:28px;flex:none;text-align:center}
.lbtn span{font-weight:700;font-size:14px;line-height:1.2}
.lbtn.done{background:#DDF3E5}
.lbtn.done b{color:var(--ok)}
.teach{grid-column:1/-1;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 16px}
.teach summary{font-weight:700;font-size:17px;cursor:pointer}
.teach .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:10px}
.teach h3{font-size:16px;margin:0 0 6px}
.teach p,.teach li{font-size:15px;line-height:1.45;max-width:62ch}
.teach ol,.teach ul{padding-left:20px;margin:0}

.modal{position:fixed;inset:0;z-index:30;background:rgba(19,32,43,.55);display:grid;place-items:center;padding:16px}
.card{background:var(--surface);border:3px solid var(--ink);border-radius:20px;padding:22px;max-width:480px;width:100%;box-sizing:border-box;box-shadow:0 6px 0 var(--ink)}
.card h2{font-family:var(--f-display);font-weight:700;font-size:34px;margin:0 0 6px;color:var(--ok)}
.card .lab{font-weight:700;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.6px;margin:12px 0 4px}
.card p{margin:0;font-size:18px;line-height:1.45;font-weight:700}
.card .extra{font-weight:400;margin-top:10px;background:var(--soft);border-radius:10px;padding:10px}
.card .acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:flex-end}

/* celular */
@media (max-width:760px){
  #app{gap:6px;padding-block:6px}
  .brand{display:none}
  .top{min-height:42px;gap:6px}
  .ibtn{width:40px;height:40px}
  .lvl-name{font-size:16px}
  .lvl-num{font-size:13px;padding:2px 9px}
  .goal{font-size:13px;line-height:1.25;padding:5px 9px;border-radius:10px}
  .goal .tag{display:none}
  .main{display:flex;flex-direction:column;gap:6px}
  .left{flex:none;gap:6px}
  .stage-wrap{flex:none;height:min(calc((100vw - 32px) * .75 + 6px),33dvh)}
  .xy{font-size:13px;padding:1px 7px;gap:8px;top:5px;left:5px}
  .fb{font-size:12px;padding:5px 8px;left:5px;right:5px;bottom:5px;border-radius:9px}
  .bigbtn{height:42px;min-width:44px;padding:0 10px;font-size:14px;border-radius:12px}
  .bigbtn svg{width:22px;height:22px}
  .bigbtn .t{display:none}
  .pad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,34px);gap:4px}
  .right{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
  .palette{flex:none;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:4px 8px 6px;gap:14px;border-radius:10px}
  .palette .blk{font-size:13px;padding:3px 8px;min-height:32px}
  .palette .blk.hat{min-height:34px;padding-top:6px}
  .pal-title{display:none}
  .pal-group{flex:none;gap:3px}
  .pal-cat{font-size:12px}
  .pal-cat i{width:11px;height:11px}
  .pal-items{flex-direction:row}
  .blk{font-size:13px;min-height:34px;padding:4px 8px;gap:5px}
  .blk.hat{min-height:38px;padding-top:8px}
  .num{width:46px}
  .program{flex:1;padding:8px;border-radius:10px}
  .prog-head{margin-bottom:6px}
  .cblk{min-width:150px}
  .start{grid-template-columns:1fr;gap:14px;padding-block:14px}
  .hero-cv{max-width:300px;order:-1}
  .tagline{font-size:17px;margin:8px 0 12px}
  .mode{min-width:0;flex:1;padding:10px 14px}
  .mode strong{font-size:20px}
  .lgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .lbtn{flex-direction:column;align-items:flex-start;gap:2px;min-height:0;padding:6px 8px}
  .lbtn span{font-size:12px}
  .twoprog{grid-template-columns:1fr}
}
@media (max-width:760px) and (max-height:560px){.stage-wrap{height:30dvh}}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}

/* ---- parte 2 y menú de partes ---- */
:root{--ap:#9966FF;--ap-d:#774DCB;--wall:#55606E;--lava:#E5322D;--goal:#22B04B}
.blk.ap{background:var(--ap);border-color:var(--ap-d);color:#fff}
.blk.ap .val,.blk.ap .txtin{color:var(--ink)}
.txtin{width:84px;border:2px solid rgba(0,0,0,.25);border-radius:6px;background:#fff;padding:3px 6px;font-weight:700;color:var(--ink);box-sizing:border-box}
.swatch{width:30px;height:22px;border-radius:6px;border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.35);padding:0;flex:none;display:inline-block;vertical-align:middle}
button.swatch{cursor:pointer}
.parts-head{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.parts-head h2{font-family:var(--f-display);font-weight:600;font-size:24px;margin:0}
.parts-head p{margin:0;color:var(--muted);font-weight:700;font-size:15px}
.pgrid{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pcard{border:3px solid var(--ink);border-radius:16px;background:var(--surface);padding:12px 14px;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;box-shadow:0 4px 0 var(--ink);min-height:92px}
.pcard .pn{grid-row:1/3;font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;width:44px;text-align:center}
.pcard strong{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.1}
.pcard small{font-size:14px;color:var(--muted);font-weight:700;line-height:1.3}
.pcard:not([disabled]):active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pcard .prog{grid-column:2;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.pcard .prog i{display:block;height:100%;background:var(--ok)}
.pcard.p1 .pn{color:var(--mo-d)} .pcard.p2 .pn{color:var(--accent)}
.pcard[disabled]{cursor:default;box-shadow:none;border-style:dashed;border-color:var(--line);background:transparent}
.pcard[disabled] .pn,.pcard[disabled] strong{color:var(--muted)}
.lock{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
.lock svg{width:14px;height:14px}
.back{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:700;font-size:15px}
.back svg{width:16px;height:16px}
.part-title{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,6vw,58px);line-height:1;margin:10px 0 0}
.part-title small{display:block;font-size:18px;color:var(--accent);font-weight:600;margin-bottom:4px;letter-spacing:.3px}
@media (max-width:760px){
  .pgrid{grid-template-columns:1fr 1fr;gap:8px}
  .pcard{grid-template-columns:1fr;padding:9px 10px;min-height:0;gap:2px}
  .pcard .pn{grid-row:auto;font-size:26px;text-align:left;width:auto}
  .pcard strong{font-size:17px}
  .pcard small{font-size:12px}
  .pcard .prog{grid-column:1}
  .swatch{width:24px;height:18px}
  .txtin{width:70px}
}

.program .blk{font-size:14px;gap:5px;padding:5px 8px;min-height:36px}
.program .blk.hat{min-height:42px;padding-top:9px}

<script>
/* ================= MOTOR (sin DOM) ================= */
// ENGINE-START
const DT = 1000/30;            // "por siempre" a 30 vueltas por segundo
const KEY_DELAY = 500;         // espera antes de repetir la tecla
const KEY_REPEAT = 33;         // repetición del sistema
const STOP_ALL = {stop:true}, DEL_CLONE = {del:true};
function normDir(d){ d = ((d + 180) % 360 + 360) % 360 - 180; return d === -180 ? 180 : Math.round(d * 100) / 100; }
function createEngine(hooks){
  hooks = hooks || {};
  const E = {time:0, held:new Set(), last:null, nextRep:0, threads:[], sprites:[], stopped:false};
  const num = v => { if (v && typeof v === 'object') v = hooks.getVar ? hooks.getVar(v.v) : 0; const n = Number(v); return isFinite(n) ? n : 0; };
  function clamp(s){
    const B = s.bounds || {x0:-224,x1:224,y0:-164,y1:164};
    s.x = Math.max(B.x0, Math.min(B.x1, s.x)); s.y = Math.max(B.y0, Math.min(B.y1, s.y));
  }
  function move(t, dx, dy, b){
    const s = t.sprite; s.x += dx; s.y += dy; clamp(s);
    s.lastOrigin = t.origin;
    if (dx || dy) s.lastDir = dx > 0 ? 'right' : dx < 0 ? 'left' : dy > 0 ? 'up' : 'down';
    if (hooks.move) hooks.move(t, dx, dy, b);
  }
  function evalCond(c, t){
    if (c.type === 'keyp') return E.held.has(c.key);
    if (c.type === 'touchc') return hooks.touching ? !!hooks.touching(t.sprite, c.color) : false;
    if (c.type === 'or') return (!!c.a && evalCond(c.a, t)) || (!!c.b && evalCond(c.b, t));
    if (c.type === 'and') return (!!c.a && evalCond(c.a, t)) && (!!c.b && evalCond(c.b, t));
    if (c.type === 'toucho') return hooks.touchingObj ? !!hooks.touchingObj(t.sprite, c.target) : false;
    if (c.type === 'eq') return hooks.getVar ? Number(hooks.getVar(c.v)) === num(c.n) : false;
    if (c.type === 'gt') return hooks.getVar ? Number(hooks.getVar(c.v)) > num(c.n) : false;
    if (c.type === 'lt') return hooks.getVar ? Number(hooks.getVar(c.v)) < num(c.n) : false;
    return false;
  }
  function* runList(list, t){ for (let i = 0; i < list.length; i++) yield* runBlock(list[i], t); }
  function* runBlock(b, t){
    const s = t.sprite;
    switch (b.type){
      case 'move': {
        const a = (s.dir == null ? 90 : s.dir) * Math.PI / 180, n = num(b.n);
        move(t, Math.round(n * Math.sin(a) * 100) / 100, Math.round(n * Math.cos(a) * 100) / 100, b); break;
      }
      case 'pointdir': s.dir = normDir(num(b.n)); break;
      case 'pointto': { const o = hooks.findSprite && hooks.findSprite(b.target); if (o && (o.x !== s.x || o.y !== s.y)) s.dir = normDir(Math.atan2(o.x - s.x, o.y - s.y) * 180 / Math.PI); break; }
      case 'bounce': {
        const B = s.bounds || {x0:-224,x1:224,y0:-164,y1:164}; let hit = false;
        if (s.x >= B.x1 || s.x <= B.x0){ s.dir = normDir(-(s.dir == null ? 90 : s.dir)); hit = true; }
        if (s.y >= B.y1 || s.y <= B.y0){ s.dir = normDir(180 - (s.dir == null ? 90 : s.dir)); hit = true; }
        if (hit && hooks.bounce) hooks.bounce(t);
        break;
      }
      case 'switchbd': { const nb = hooks.switchBackdrop ? hooks.switchBackdrop(b.bd, t) : null; if (nb) E.backdropEvent(nb); break; }
      case 'hide': s.hidden = true; if (hooks.hidden) hooks.hidden(t); break;
      case 'show': s.hidden = false; if (hooks.shown) hooks.shown(t); break;
      case 'broadcast': E.broadcast(b.msg); break;
      case 'gotoobj': { const o = hooks.findSprite && hooks.findSprite(b.target); if (o){ s.x = o.x; s.y = o.y; s.lastOrigin = t.origin; } break; }
      case 'clone': { const src = b.target === 'mí mismo' ? s : (hooks.findSprite && hooks.findSprite(b.target)); if (src) E.makeClone(src); break; }
      case 'delclone': if (s.isClone){ E.removeSprite(s); throw DEL_CLONE; } break;
      case 'setvar': if (hooks.setVar) hooks.setVar(b.v, num(b.n), t); break;
      case 'changevar': if (hooks.setVar) hooks.setVar(b.v, Number(hooks.getVar(b.v) || 0) + num(b.n), t); break;
      case 'gorandom': { const p = hooks.randomPos ? hooks.randomPos(s) : {x:0, y:0}; s.x = p.x; s.y = p.y; if (hooks.jumped) hooks.jumped(t); break; }
      case 'wait': { const n = Math.max(0, Math.round(num(b.n) * 30)); for (let i = 0; i < n; i++) yield; break; }
      case 'cx':   move(t, num(b.n), 0, b); break;
      case 'cy':   move(t, 0, num(b.n), b); break;
      case 'goto':
        if (hooks.goto) hooks.goto(t, b);
        s.x = num(b.x); s.y = num(b.y); clamp(s); s.lastOrigin = t.origin;
        if (hooks.move) hooks.move(t, 0, 0, b);
        break;
      case 'say': s.bubble = String(b.text == null ? '' : b.text); if (hooks.say) hooks.say(t, b); break;
      case 'stop': E.threads = []; E.stopped = true; if (hooks.stop) hooks.stop(t); throw STOP_ALL;
      case 'forever': for(;;){ yield* runList(b.body, t); yield; }
      case 'repeat': { const n = Math.max(0, Math.round(num(b.n))); for (let i = 0; i < n; i++){ yield* runList(b.body, t); yield; } break; }
      case 'nextcos': { const cyc = hooks.costumeList ? hooks.costumeList(s) : ['paso 1','paso 2','feliz','dolor']; const i = cyc.indexOf(s.costume); s.costume = cyc[(i + 1) % cyc.length]; if (hooks.costume) hooks.costume(t, s.costume); break; }
      case 'setcos': s.costume = b.cos; if (hooks.costume) hooks.costume(t, s.costume); break;
      case 'if':
        t.askedIf = true;
        if (!b.cond){ if (hooks.emptyCond) hooks.emptyCond(t); break; }
        if (evalCond(b.cond, t)) yield* runList(b.body, t);
        break;
    }
  }
  function start(sprite, script, origin){
    const t = {sprite, script, origin, key: script.key};
    t.gen = runList(script.body, t);
    E.threads.push(t);
    return t;
  }
  function fire(k){
    for (const s of E.sprites.slice()) for (const sc of s.program)
      if (sc.hat === 'key' && sc.key === k && !E.threads.some(t => t.script === sc && t.sprite === s)) start(s, sc, 'key');
  }
  function clearClones(){ for (let i = E.sprites.length - 1; i >= 0; i--) if (E.sprites[i].isClone) E.sprites.splice(i, 1); }
  E.broadcast = msg => {
    for (const s of E.sprites.slice()) for (const sc of s.program) if (sc.hat === 'msg' && sc.msg === msg){
      E.threads = E.threads.filter(t => !(t.script === sc && t.sprite === s));
      start(s, sc, 'msg');
    }
  };
  E.makeClone = src => {
    if (E.sprites.filter(o => o.isClone).length >= 40) return;
    const c = Object.assign({}, src, {isClone:true, bubble:'', moved:0});
    E.sprites.push(c);
    for (const sc of c.program) if (sc.hat === 'clone') start(c, sc, 'clone');
    if (hooks.cloned) hooks.cloned(c);
  };
  E.backdropEvent = name => {
    for (const s of E.sprites.slice()) for (const sc of s.program) if (sc.hat === 'bd' && sc.bd === name){
      E.threads = E.threads.filter(t => !(t.script === sc && t.sprite === s));
      start(s, sc, 'bd');
    }
  };
  E.removeSprite = sp => { const i = E.sprites.indexOf(sp); if (i >= 0) E.sprites.splice(i, 1); E.threads = E.threads.filter(t => t.sprite !== sp); };
  E.flag = () => { E.threads = []; E.stopped = false; clearClones(); for (const s of E.sprites) for (const sc of s.program) if (sc.hat === 'flag') start(s, sc, 'flag'); };
  E.stop = () => { E.threads = []; clearClones(); };
  E.keyDown = k => {
    if (E.held.has(k)) return;
    E.held.add(k); E.last = k; E.nextRep = E.time + KEY_DELAY;   // solo repite la ÚLTIMA tecla apretada
    fire(k);
  };
  E.keyUp = k => { E.held.delete(k); if (E.last === k) E.last = null; };
  E.releaseAll = () => { E.held.clear(); E.last = null; };
  E.alive = () => E.threads.length > 0;
  E.step = () => {
    E.time += DT;
    while (E.last && E.time >= E.nextRep){ fire(E.last); E.nextRep += KEY_REPEAT; }
    for (const t of E.threads.slice()){
      if (!E.threads.includes(t)) continue;
      let done;
      try { done = t.gen.next().done; } catch(e){ if (e === STOP_ALL) break; if (e === DEL_CLONE) continue; throw e; }
      if (done) E.threads.splice(E.threads.indexOf(t), 1);
    }
  };
  return E;
}

function rocksDiagonal(){
  const r = [], off = 52 / Math.SQRT2;
  for (let t = -260; t <= 200; t += 26){
    for (const s of [-1, 1]){
      const x = t + s*(-off), y = t + 40 + s*off;
      if (x > -236 && x < 236 && y > -176 && y < 176) r.push({x, y});
    }
  }
  return r;
}

const ARROW_FULL = (key, d) => { const m = v => d === 'x' ? cx(v) : cy(v), v = (key === 'right' || key === 'up') ? 10 : -10;
  return iff(kp(key), m(v), iff(tc('wall'), m(-v)), iff(tc('ice'), m(v), iff(tc('wall'), m(-v))), iff(tc('mud'), m(-v/2))); };
const MOVE_FULL = () => fe(ARROW_FULL('right','x'), ARROW_FULL('left','x'), ARROW_FULL('up','y'), ARROW_FULL('down','y'));
// recorre solo lo que está adentro de un "por siempre" (lo que se pregunta todo el tiempo)
function walkF(list, fn, inF){ list.forEach(b => { if (inF) fn(b); if (b.body) walkF(b.body, fn, inF || b.type === 'forever'); }); }
const hasRule = (color, pred) => { let ok = false; prog.forEach(sc => walkF(sc.body, b => {
  if (b.type === 'if' && b.cond && b.cond.type === 'touchc' && b.cond.color === color){ walk(b.body, x => { if (pred(x)) ok = true; }); }
})); return ok; };
const lavaRule = () => hasRule('lava', b => b.type === 'goto');
const nested = (keys, color, pred) => { let ok = false; prog.forEach(sc => walk(sc.body, b => {
  if (b.type === 'if' && b.cond && b.cond.type === 'keyp' && keys.includes(b.cond.key))
    b.body.forEach(x => { if (x.type === 'if' && x.cond && x.cond.type === 'touchc' && x.cond.color === color && x.body.some(pred)) ok = true; });
})); return ok; };
const mudNested = () => { let ok = false; prog.forEach(sc => walk(sc.body, b => {
  if (b.type === 'if' && b.cond && b.cond.type === 'keyp' && (b.cond.key === 'right' || b.cond.key === 'd'))
    b.body.forEach(x => { if (x.type === 'if' && x.cond && x.cond.type === 'touchc' && x.cond.color === 'mud' && x.body.some(y => y.type === 'cx' && Number(y.n) < 0)) ok = true; });
})); return ok; };
const wallRule = () => hasRule('wall', b => b.type === 'cx' || b.type === 'cy');
const starsDone = () => stars.every(s => s.got || s.opt);

const PATROL = (n=5) => hatFlag(fe(mv(n), bounceB()));

const BUG = (x, y, program) => ({name:'Bichito', kind:'bug', x, y, program});
const WASP = (name, x, y, program, dir=90, color='#7A4DD8') => ({name, kind:'wasp', x, y, dir, program, color});
const progOf = name => { const sp = sprites.find(o => o.name === name); return sp ? sp.program : []; };
const scan = (programs_, pred) => { let ok = false; programs_.forEach(sc => walk(sc.body, b => { if (pred(b)) ok = true; })); return ok; };
const condTargets = c => !c ? [] : c.type === 'toucho' ? [c.target] : (c.type === 'or' || c.type === 'and') ? [...condTargets(c.a), ...condTargets(c.b)] : [];
const scanF = (programs_, pred) => { let ok = false; programs_.forEach(sc => walkF(sc.body, b => { if (pred(b)) ok = true; })); return ok; };
const enemyRule = (who, pred) => scanF(progOf('Bichito'), b => b.type === 'if' && condTargets(b.cond).includes(who) && b.body.some(pred));
const enemyRuleOnce = (who) => scan(progOf('Bichito'), b => b.type === 'if' && condTargets(b.cond).includes(who));
const chaseSpeed = () => { let n = null; walk((progOf('Avispa')[0] || {body:[]}).body, b => { if (b.type === 'move') n = Number(b.n); }); return n; };

let AC = null, muted = false, lastTick = 0;
function ac(){
  if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type='sine', v=.12, delay=0, to=null){
  if (muted) return; const a = ac(); if (!a) return;
  const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + .01); g.gain.exponentialRampToValueAtTime(.0008, t0 + d);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + d + .02);
}

let fbTimer = 0, lastMsg = '', lastMsgAt = 0;
function say(msg, good){
  const now = performance.now();
  if (msg === lastMsg && now - lastMsgAt < 3500) return;
  lastMsg = msg; lastMsgAt = now;
  const fb = $('#fb'); fb.textContent = msg; fb.classList.toggle('good', !!good); fb.hidden = false;
  clearTimeout(fbTimer); fbTimer = setTimeout(() => fb.hidden = true, 7000);
}

/* ================= PROGRAMA: búsqueda ================= */
function walk(list, fn, parentId){ list.forEach((b,i) => { fn(b, list, i, parentId); if (b.body) walk(b.body, fn, b.id); }); }
function allBlocks(){ const out = []; prog.forEach(sc => walk(sc.body, b => out.push(b), sc.id)); return out; }
function findBlock(id){ return allBlocks().find(b => b.id === id); }
function findList(id){ const sc = prog.find(s => s.id === id); if (sc) return sc.body; const b = findBlock(id); return b && b.body ? b.body : null; }
function findParent(id){ let r = null; prog.forEach(sc => walk(sc.body, (b, list, i, pid) => { if (b.id === id) r = {list, i, pid}; }, sc.id)); return r; }
const has = (list, type) => { let f = false; walk(list, b => { if (b.type === type) f = true; }); return f; };
function ifOutsideForever(list){ return list.some(b => b.type === 'if'); }
function defaultSel(){
  const open_ = prog.filter(sc => !(sc.fold && !sc.open));
  if (!open_.length) return null;
  const last = open_[open_.length - 1];
  if (L.selStart) return {owner:last.id, index:0};
  if (L.selInIf){
    let e = null;
    open_.forEach(sc => walk(sc.body, b => { if (!e && b.type === 'if' && b.cond && (condTargets(b.cond).length || b.cond.type === 'touchc')) e = b; }));
    if (e) return {owner:e.id, index:e.body.length};
  }
  if (L.selEmptyInner){ const e = allBlocks().find(b => b.type === 'if' && b.cond && b.cond.type === 'touchc' && !b.body.length); if (e) return {owner:e.id, index:0}; }
  if (L.selInside && last.body[0] && last.body[0].type === 'forever') return {owner:last.body[0].id, index:0};
  const lb = last.body[last.body.length - 1];
  if (lb && lb.type === 'forever') return {owner:lb.id, index:lb.body.length};
  return {owner:last.id, index:last.body.length};
}
function findInScript(sc, id){ let f = false; walk(sc.body, b => { if (b.id === id) f = true; }); return f; }
function allOrs(){ const out = []; const scan = c => { if (c && (c.type === 'or' || c.type === 'and')){ out.push(c); scan(c.a); scan(c.b); } }; allBlocks().forEach(b => { if (b.type === 'if') scan(b.cond); }); return out; }
const findOr = id => allOrs().find(o => o.id === id);
function fixSel(){
  if (sel && sel.orSlot && !findOr(sel.orSlot)) sel = null;
  if (sel && sel.cond && !findBlock(sel.cond)) sel = null;
  if (sel && sel.owner && !findList(sel.owner)) sel = null;
  if (!sel) sel = defaultSel();
}

/* ================= PROGRAMA: edición ================= */
function insert(t){
  ac(); const Pb = PAL[t];
  if (Pb.hat){
    const sc = Pb.make(); prog.push(sc); sel = {owner:sc.id, index:0}; SND.pop(); renderProgram(); return;
  }
  if (t === 'or' || t === 'and'){
    const nm = t === 'or' ? '“o”' : '“y”', isOp = c => c && (c.type === 'or' || c.type === 'and');
    let target = sel && sel.cond ? findBlock(sel.cond) : null;
    if (!target && sel && sel.owner){ const ob = findBlock(sel.owner); if (ob && ob.type === 'if') target = ob; }
    if (!target) target = allBlocks().reverse().find(b => b.type === 'if' && !isOp(b.cond));
    if (!target){ say('El bloque ' + nm + ' va en el hueco de un “si”. Primero poné un “si”.'); SND.oops(); return; }
    if (isOp(target.cond)){ say('Ese “si” ya tiene un ' + (target.cond.type === 'or' ? '“o”' : '“y”') + '. Tocá otra pregunta celeste.'); SND.oops(); return; }
    const o = Pb.make(); o.a = target.cond || null; target.cond = o;
    sel = {orSlot:o.id, side:o.a ? 'b' : 'a'}; SND.pop(); renderProgram(); return;
  }
  if (COND_TYPES.includes(t)){
    // primero, un hueco libre de un "o"
    let slotOr = sel && sel.orSlot ? findOr(sel.orSlot) : null, side = sel && sel.side;
    if (!(slotOr && !slotOr[side])){ slotOr = allOrs().find(o => !o.a || !o.b); side = slotOr ? (!slotOr.a ? 'a' : 'b') : null; }
    if (slotOr && !(sel && sel.cond)){
      const c = Pb.make();
      const other = slotOr[side === 'a' ? 'b' : 'a'];
      if (c.type === 'keyp' && other && other.type === 'keyp' && TWIN[other.key]) c.key = TWIN[other.key];
      slotOr[side] = c;
      sel = (!slotOr.a || !slotOr.b) ? {orSlot:slotOr.id, side:!slotOr.a ? 'a' : 'b'} : null;
      fixSel(); SND.pop(); renderProgram(); return;
    }
    let target = sel && sel.cond ? findBlock(sel.cond) : null;
    if (!target && sel && sel.owner){ const ob = findBlock(sel.owner); if (ob && ob.type === 'if' && !ob.cond) target = ob; }
    if (!target) target = allBlocks().reverse().find(b => b.type === 'if' && !b.cond);
    if (!target){ say('Los bloques celestes van en el hueco de un “si”. Primero poné un “si”.'); SND.oops(); return; }
    target.cond = Pb.make(); sel = {owner:target.id, index:target.body.length}; SND.pop(); renderProgram(); return;
  }
  if (!prog.length){ say('Primero poné un evento amarillo: el programa necesita saber cuándo arrancar.'); SND.oops(); return; }
  fixSel();
  if (!sel){ say('Empezá un programa nuevo: tocá “al hacer clic en bandera”.'); SND.oops(); return; }
  let list, index, owner;
  if (sel.cond){ const ib = findBlock(sel.cond); list = ib.body; index = list.length; owner = ib.id; }
  else { list = findList(sel.owner); index = Math.min(sel.index, list.length); owner = sel.owner; }
  // debajo de un "por siempre" no se puede encastrar nada: va adentro
  const isScript = prog.some(s => s.id === owner);
  if (isScript && index > 0 && index === list.length && list[index - 1].type === 'forever'){
    const f = list[index - 1]; list = f.body; index = list.length; owner = f.id;
  }
  const b = Pb.make();
  if (b.type === 'forever' || b.type === 'repeat'){ b.body = list.splice(index); list.push(b); sel = {owner:b.id, index:b.body.length}; } // como Scratch: envuelve lo de abajo
  else if (b.type === 'if'){ b.body = list.splice(index); list.push(b); sel = {owner:b.id, index:b.body.length}; } // también envuelve, como Scratch
  else { list.splice(index, 0, b); sel = {owner, index:index + 1}; }
  SND.pop(); renderProgram();
}
function removeBlock(id){
  const si = prog.findIndex(s => s.id === id);
  if (si >= 0) prog.splice(si, 1);
  else { const p = findParent(id); if (p) p.list.splice(p.i, 1); }
  fixSel(); renderProgram();
}

// flechita que dice hacia dónde va el número
const DIRS = {
  cx:{pos:['derecha','▶'], neg:['izquierda','◀'], c:'x'},
  cy:{pos:['arriba','▲'], neg:['abajo','▼'], c:'y'},
  move:{pos:['adelante','▶'], neg:['para atrás','◀'], c:'x'},
};
function setDir(ch, b){
  if (b.type === 'pointdir'){
    const v = normDir(Number(b.n) || 0), M = {'0':'▲ arriba', '90':'derecha ▶', '180':'▼ abajo', '-90':'◀ izquierda', '45':'↗ diagonal', '135':'↘ diagonal', '-135':'↙ diagonal', '-45':'↖ diagonal'};
    ch.hidden = false; ch.className = 'dir ' + ((v === 0 || v === 180) ? 'y' : 'x');
    ch.textContent = M[String(v)] || 'en diagonal ↗'; return;
  }
  const d = DIRS[b.type], v = Number(b.n) || 0;
  if (!v){ ch.hidden = true; return; }
  ch.hidden = false;
  const [word, ar] = v < 0 ? d.neg : d.pos;
  ch.className = 'dir ' + d.c + (v < 0 ? ' neg' : '');
  ch.textContent = (ar === '◀' ? ar + ' ' : '') + (v < 0 ? 'menos: ' : 'más: ') + word + (ar !== '◀' ? ' ' + ar : '');
}
function dirChip(b){ const ch = el('span','dir'); setDir(ch, b); return ch; }

const BODY_R = 15;
function touchAt(x, y, r, c){
  if (!L.map) return false;
  for (const m of L.map){
    if (c && m.c !== c) continue;
    const dx = x - Math.max(m.x0, Math.min(x, m.x1)), dy = y - Math.max(m.y0, Math.min(y, m.y1));
    if (dx*dx + dy*dy < r*r) return true;
  }
  return false;
}

const hooks = {
  move(t, dx, dy, b){
    if (t.origin === 'flag' && (dx || dy)){ if (ARROWS.some(k => engine.held.has(k))) R.movedArrow = true; if (WASD.some(k => engine.held.has(k))) R.movedWasd = true; }

    if (b.type === 'move' && t.origin === 'key'){
      if (t.key === 'left' && dx > 0) say('Apretaste la flecha izquierda, pero “mover 10 pasos” va para donde mira el bichito: la derecha. ¿Qué número lo haría ir para atrás?');
      if (t.key === 'up' || t.key === 'down') say('“Mover pasos” siempre va hacia donde mira el bichito. Para subir o bajar no alcanza: falta otra idea.');
    }
  },
  touching(s, color){ return touchAt(s.x, s.y, BODY_R, color); },
  findSprite(name){ return sprites.find(o => o.name === name && !o.isClone); },
  getVar(v){ return VARS[v] ?? 0; },
  switchBackdrop(name){
    if (!L.backdrops) return null;
    const order = L.bdOrder, from = BACKDROP;
    let to = name === 'siguiente fondo' ? order[(order.indexOf(from) + 1) % order.length] : name;
    if (!L.backdrops[to]) return null;
    if (from === 'noche' && name === 'siguiente fondo') R.finishedNoche = true;
    if (from === 'arena' && to === 'arena') R.arenaGoal = true;
    BACKDROP = to; L.map = L.backdrops[to].map;
    if (from !== to){ tone(523, .1, 'triangle', .08); tone(784, .14, 'triangle', .08, .09); }
    return to;
  },
  costumeList(s){ return cosNames(); },
  costume(t, name){
    const s = t.sprite; if (s.kind !== 'bug') return;
    R.cosChanges = (R.cosChanges || 0) + 1;
    if (engine.held.size){ R.walkSwaps = (R.walkSwaps || 0) + 1; if (name === 'feliz' || name === 'dolor') R.oddWhileWalk = (R.oddWhileWalk || 0) + 1; }
    if (name === 'dolor') R.hurtShown = true;

  shown(t){

    if (s.kind === 'seed'){
      R.shots = (R.shots || 0) + 1; tone(700, .08, 'triangle', .07);
      const bug = sprites.find(o => o.kind === 'bug');
      if (bug && Math.hypot(bug.x - s.x, bug.y - s.y) < 6) R.shotsFromBug = (R.shotsFromBug || 0) + 1;
      else if (L.id === 'p5-dedonde'){ burst(s.x, s.y, '#8B5A2B'); if (!R.topHint){ R.topHint = true; say('La semilla apareció arriba, donde había quedado, y se escondió enseguida. Tiene que salir desde el bichito: poné “ir a Bichito” arriba del “mostrar”.'); } }
    }
  },
  cloned(c){
    if (c.kind === 'seed'){
      tone(760, .06, 'triangle', .06);

        if ((VARS.semillas ?? 0) <= 0){ R.freeShot = true; if (!R.freeHint){ R.freeHint = true; say('¡Disparaste sin tener semillas! Envolvé “crear clon” con “si semillas > 0”.'); } }
        else R.legitShots = (R.legitShots || 0) + 1;

  },
  setVar(v, n, t){

  },
  randomPos(s){

  },
  jumped(t){

  },
  touchingObj(s, target){

    const rad = o => (o.kind === 'sword' || s.kind === 'sword') ? 50 : (o.kind === 'seed' || s.kind === 'seed') ? 22 : (o.kind === 'ship' || s.kind === 'ship') ? 26 : 28;

    if ((s.x >= 224 || s.x <= -224) && s.name === 'Avispa' && Math.abs(ad - 90) < 1) R.hBounce = (R.hBounce || 0) + 1;

  },
  goto(t){ if (touchAt(t.sprite.x, t.sprite.y, BODY_R, 'lava')){ SND.lava(); burst(t.sprite.x, t.sprite.y, '#E5322D'); } },
  say(t){ if (L.id === 'p5-mayor'){ if ((VARS.semillas ?? 0) > 3) R.saidGt = true; if ((VARS.semillas ?? 0) < 1) R.saidLt = true; } if (touchAt(t.sprite.x, t.sprite.y, BODY_R, 'goal')) R.saidOnGoal = true; if (L.id === 'p4-igual' && VARS.puntos === 5) R.said5 = true; },
  stop(t){

    else if (L.id === 'p4-reloj' || L.id === 'p4-regresiva' || P.n === 5){ R.stopPts = VARS.puntos ?? 0; }
    else if (P.n === 4 && L.vars && (VARS.vidas ?? 1) <= 0){ R.gameOver = true; SND.oops(); if (L.id !== 'p4-over') say('¡Te quedaste sin vidas! Apretá la banderita para jugar otra vez.'); }
    else if (P.n === 4 && L.vars && (VARS.puntos ?? 0) >= 10){ R.wonByPoints = true; }
    else if (L.loseMsg){ SND.bump(); say(L.loseMsg()); }
    else if (P.n === 3 && L.mode !== 'cierre'){ SND.bump(); say('¡Te atrapó la avispa! Apretá la banderita y probá otra vez.'); }
    else if (L.mode !== 'cierre' && L.mode !== 'sandbox' && P.n < 6) say('El programa se detuvo antes de la meta. ¿El “detener todos” está adentro del “si toca el verde”?');
  },

};
function wallMsg(s){
  if (L.noWallMsg && !nested(['right','d'], 'wall', x => x.type === 'cx' && Number(x.n) < 0)) return L.noWallMsg;

let acc = 0, prevT = performance.now();
function loop(now){
  const dt = Math.min(200, now - prevT); prevT = now;
  if ($('#startScreen').hidden){
    if (engine && L.mode !== 'explore'){
      acc += dt; let n = 0;
      while (acc >= DT && n < 6){ engine.step(); afterStep(); acc -= DT; n++; }
      if (n === 6) acc = 0;

    for (const p of particles){ p.x += p.vx; p.y += p.vy; p.vy -= .12; p.life -= .03; }

const heroCv = $('#heroCv'), partCv = $('#partCv');
function drawHero(t){
  const showingPart = !$('#partView').hidden;
  const cvs = showingPart ? partCv : heroCv, c = cvs.getContext('2d'), W = cvs.width, H = cvs.height, k = W/480;
